  <title>Wildflower Hours — Cindy Qi</title>

  <style>
* { box-sizing: border-box; }
:root { color-scheme: light; }
body { margin: 0; background: #fffefa; color: #514a46; font-family: Georgia, 'Times New Roman', serif; }
main {
  width: 100%; max-width: 900px; height: 100vh; height: 100dvh;
  margin: 0 auto; padding: 16px 20px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  gap: 10px;
}
h1 { margin: 0; text-align: center; font-size: clamp(34px, 6vw, 64px); line-height: 1.15; font-weight: 400; letter-spacing: -1px; }
h1 i { color: #a97495; font-weight: 400; }
#clock { width: 100%; min-height: 0; min-width: 0; display: flex; justify-content: center; align-items: center; }
canvas { display: block; max-width: 100%; max-height: 100%; flex: 0 0 auto; touch-action: pan-y; }
.time { display: flex; align-items: flex-start; justify-content: center; gap: 15px; }
.time span { text-align: center; min-width: 44px; }
.time b { font-size: 29px; line-height: 1; font-weight: 400; font-variant-numeric: tabular-nums; }
.time span:nth-of-type(1) b { color: #a97495; }
.time span:nth-of-type(2) b { color: #668064; }
.time span:nth-of-type(3) b { color: #c7773e; }
.time small { display: block; margin-top: 5px; color: #92857d; font-size: 10px; font-style: italic; line-height: 1.2; }
.time em { padding-top: 2px; font-size: 22px; color: #b4aaa0; font-style: normal; }
.time sup { font: 8px Arial, sans-serif; padding-top: 6px; color: #92857d; }
.controls { display: flex; justify-content: center; gap: 12px; }
.controls button { min-height: 42px; padding: 8px 18px; border: 1px solid #d7c9cf; border-radius: 45% 48% 43% 47%; background: transparent; color: #95627f; font: italic 12px Georgia, serif; cursor: pointer; }
.controls button:last-child { border-color: #c7d2bf; color: #647c5a; }
.controls button:hover { background: #f8f1f5; }
.controls button:focus-visible { outline: 2px solid #95627f; outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media(max-height: 450px) {
  main { gap: 5px; padding: 8px 16px; }
  h1 { font-size: 30px; }
  .time b { font-size: 23px; }
  .time small { margin-top: 2px; }
  .controls button { min-height: 36px; padding: 6px 16px; }
}

.time sup { white-space: nowrap; }

</style>

  <main>
    <h1>Wildflower <i>Hours</i></h1>

    <div class="time" role="timer" aria-live="off" aria-label="Current local time">
      <span><b id="hours">00</b><small>hours</small></span><em>:</em>

      <button id="pollen" type="button">scatter pollen</button>
      <button id="breeze" type="button">a little breeze</button>
    </div>

  </main>
