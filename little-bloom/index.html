<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Bloom</title><style>*{box-sizing:border-box}body{margin:0;background:#f7ebcb;font-family:Georgia,serif}main{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;margin:auto;background:radial-gradient(#fff5db,#f5e6bb);overflow:hidden}header{position:absolute;z-index:2;top:3%;width:100%;text-align:center;pointer-events:none}h1{font-style:italic;font-weight:normal;color:#633d2d;font-size:clamp(38px,6vw,90px);margin:0 0 10px}nav{display:flex;justify-content:center;gap:10px;pointer-events:auto}button{background:#fff3d8;border:2px solid #78523a;border-radius:12px;color:#68432e;width:clamp(44px,7vw,88px);height:clamp(48px,8vw,95px);font:clamp(22px,3vw,40px) Georgia;cursor:pointer}button span{display:block;font-size:.7em;color:#b48b65}#garden{position:absolute;inset:0}canvas{width:100%!important;height:100%!important;display:block}</style><main><header><h1>Little Bloom</h1><nav><button data-k="1">1<span>✿</span></button><button data-k="2">2<span>✿</span></button><button data-k="3">3<span>✿</span></button><button data-k="4">4<span>🦋</span></button><button data-k="5">5<span>×</span></button><button data-k="6">6<span>❧</span></button></nav></header><div id="garden"></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script><script src="sketch.js"></script><script>document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>trigger(b.dataset.k)));</script></html>
